name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version label used for the package name"
        required: false
        default: dev
        type: string

permissions:
  contents: write
  packages: write

env:
  CBZ_VCPKG_ROOT: C:\vcpkg
  VCPKG_ROOT: C:\vcpkg
  VCPKG_FEED_URL: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
  VCPKG_BINARY_SOURCES: clear;nuget,https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json,readwrite
  PKG_CONFIG_PATH: /c/vcpkg/installed/x64-windows/lib/pkgconfig
  PKG_CONFIG_ALLOW_SYSTEM_CFLAGS: 1

jobs:
  windows-check:
    runs-on: windows-latest
    # Observed:
    # pre-cache baseline       : ~30 min
    # cargo+target cache (warm): ~15 min
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.0
      - name: Cache Cargo registry/git
        id: cargo-cache
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
          key: ${{ runner.os }}-cargo-registry-git-${{ hashFiles('**/Cargo.lock', '.cargo/config.toml', 'rust-toolchain.toml', 'rust-toolchain') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-git-
      - name: Cache target/release
        id: target-cache
        uses: actions/cache@v4
        with:
          path: |
            target/release
          key: ${{ runner.os }}-target-release-${{ hashFiles('**/Cargo.lock', '.cargo/config.toml', 'rust-toolchain.toml', 'rust-toolchain') }}
          restore-keys: |
            ${{ runner.os }}-target-release-
      - name: Report Cargo cache status
        shell: pwsh
        run: |
          Write-Host "cargo cache key: ${{ runner.os }}-cargo-registry-git-${{ hashFiles('**/Cargo.lock', '.cargo/config.toml', 'rust-toolchain.toml', 'rust-toolchain') }}"
          Write-Host "cargo cache-hit: ${{ steps.cargo-cache.outputs.cache-hit }}"
          Write-Host "cargo cache paths: ~\\.cargo\\registry, ~\\.cargo\\git"
          Write-Host "target cache key: ${{ runner.os }}-target-release-${{ hashFiles('**/Cargo.lock', '.cargo/config.toml', 'rust-toolchain.toml', 'rust-toolchain') }}"
          Write-Host "target cache-hit: ${{ steps.target-cache.outputs.cache-hit }}"
          Write-Host "target cache path: target/release"
      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Restore project vcpkg root after MSVC setup
        shell: pwsh
        run: |
          if (!(Test-Path (Join-Path $env:CBZ_VCPKG_ROOT "vcpkg.exe"))) {
            Write-Error "Project vcpkg executable was not found: $env:CBZ_VCPKG_ROOT"
            exit 1
          }
          Add-Content $env:GITHUB_ENV "VCPKG_ROOT=$env:CBZ_VCPKG_ROOT"
          Write-Host "VCPKG_ROOT restored to $env:CBZ_VCPKG_ROOT"
      - name: Configure vcpkg GitHub Packages binary cache
        shell: pwsh
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $vcpkg = Join-Path $env:CBZ_VCPKG_ROOT "vcpkg.exe"
          $nugetOutput = @(& $vcpkg fetch nuget)
          if ($LASTEXITCODE -ne 0 -or $nugetOutput.Count -eq 0) {
            Write-Error "vcpkg could not fetch NuGet"
            exit 1
          }
          $nuget = ($nugetOutput | Select-Object -Last 1).ToString().Trim()
          if (!(Test-Path -LiteralPath $nuget -PathType Leaf)) {
            Write-Error "vcpkg NuGet executable was not found: $nuget"
            exit 1
          }

          & $nuget sources remove -Name GitHubPackages -NonInteractive 2>$null
          & $nuget sources add `
            -Source $env:VCPKG_FEED_URL `
            -StorePasswordInClearText `
            -Name GitHubPackages `
            -UserName "${{ github.repository_owner }}" `
            -Password $env:GH_PACKAGES_TOKEN `
            -NonInteractive
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Could not add GitHub Packages NuGet source"
            exit 1
          }
          & $nuget setapikey $env:GH_PACKAGES_TOKEN -Source $env:VCPKG_FEED_URL -NonInteractive
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Could not configure GitHub Packages NuGet API key"
            exit 1
          }
          Write-Host "VCPKG_BINARY_SOURCES=$env:VCPKG_BINARY_SOURCES"
      - name: Install LLVM for ff-sys bindgen
        shell: pwsh
        run: |
          $llvmBin = "C:\Program Files\LLVM\bin"
          if (!(Test-Path (Join-Path $llvmBin "libclang.dll"))) {
            choco install llvm --yes --no-progress
          }
          if (!(Test-Path (Join-Path $llvmBin "libclang.dll"))) {
            Write-Error "LLVM libclang.dll was not found at $llvmBin"
            exit 1
          }
          Add-Content $env:GITHUB_ENV "LIBCLANG_PATH=$llvmBin"
          Add-Content $env:GITHUB_PATH $llvmBin
      - name: Verify MSVC tools
        shell: pwsh
        run: |
          where.exe link
          where.exe cl
          Write-Host "CBZ_VCPKG_ROOT=$env:CBZ_VCPKG_ROOT"
          Write-Host "VCPKG_ROOT=$env:VCPKG_ROOT"
      - name: Verify NASM for TurboJPEG SIMD
        shell: pwsh
        run: |
          $nasm = Get-Command nasm -ErrorAction SilentlyContinue
          $nasmPath = $nasm.Source
          if (-not $nasm) {
            $knownNasm = @(
              (Join-Path ${env:ProgramFiles} "NASM\nasm.exe"),
              (Join-Path ${env:ProgramFiles(x86)} "NASM\nasm.exe")
            ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
            if ($knownNasm) {
              $nasmPath = $knownNasm
              Add-Content $env:GITHUB_PATH (Split-Path -Parent $knownNasm)
            } else {
              Write-Error "NASM is required for the turbojpeg-sys require-simd build"
              exit 1
            }
          }
          & $nasmPath -v
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
      - name: Install dav1d (vcpkg)
        shell: pwsh
        run: |
          $start = Get-Date
          & (Join-Path $env:CBZ_VCPKG_ROOT "vcpkg.exe") install dav1d:x64-windows
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $elapsed = (Get-Date) - $start
          Write-Host ("dav1d vcpkg elapsed seconds: {0:N2}" -f $elapsed.TotalSeconds)
      - name: Install FFmpeg (vcpkg, dynamic LGPL build)
        shell: pwsh
        run: |
          # ff-sys requires the x64-windows development files and links the
          # FFmpeg libraries dynamically. Do not enable GPL or nonfree features.
          $start = Get-Date
          & (Join-Path $env:CBZ_VCPKG_ROOT "vcpkg.exe") install "ffmpeg[avcodec,avformat,avfilter,swresample,swscale]:x64-windows"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $elapsed = (Get-Date) - $start
          Write-Host ("FFmpeg vcpkg elapsed seconds: {0:N2}" -f $elapsed.TotalSeconds)
      - name: Patch dav1d.pc for pkg-config
        shell: pwsh
        run: |
          $src = Join-Path $env:CBZ_VCPKG_ROOT "installed\x64-windows\lib\pkgconfig\dav1d.pc"
          $dst = Join-Path $env:RUNNER_TEMP "dav1d.pc"
          $dstUninstalled = Join-Path $env:RUNNER_TEMP "dav1d-uninstalled.pc"

          if (-not (Test-Path $src)) {
            Write-Error "dav1d.pc not found: $src"
            exit 1
          }

          (Get-Content $src) `
            -replace '^prefix=.*', 'prefix=C:/vcpkg/installed/x64-windows' `
            -replace '^includedir=.*', 'includedir=${prefix}/include' `
            -replace '^libdir=.*', 'libdir=${prefix}/lib' `
            -replace '"-L\$\{libdir\}"', '-L${libdir}' `
            -replace '"-I\$\{includedir\}"', '-I${includedir}' |
            Set-Content $dst

          Copy-Item $dst $dstUninstalled -Force

          $pkgConfigPath = $env:RUNNER_TEMP.Replace('\','/')

          Add-Content $env:GITHUB_ENV "PKG_CONFIG_PATH=$pkgConfigPath"

          Write-Host "PKG_CONFIG_PATH=$pkgConfigPath"
      - name: Setup pkg-config from vcpkg installed pkgconf
        shell: pwsh
        run: |
          $pkgconfRoot = Join-Path $env:CBZ_VCPKG_ROOT "installed\x64-windows\tools\pkgconf"
          $pkg = Get-ChildItem $pkgconfRoot `
            -Recurse `
            -Filter pkgconf.exe `
            -File `
            -ErrorAction SilentlyContinue |
            Sort-Object FullName |
            Select-Object -First 1
          if (-not $pkg) {
            Write-Error "vcpkg installed pkgconf.exe not found under $pkgconfRoot"
            exit 1
          }
          Add-Content $env:GITHUB_ENV "PKG_CONFIG=$($pkg.FullName)"
          Write-Host "PKG_CONFIG=$($pkg.FullName)"
      - name: Verify pkg-config
        shell: pwsh
        run: |
          Write-Host "PKG_CONFIG=$env:PKG_CONFIG"
          Write-Host "PKG_CONFIG_PATH=$env:PKG_CONFIG_PATH"
          if (!(Test-Path -LiteralPath $env:PKG_CONFIG -PathType Leaf)) {
            Write-Error "PKG_CONFIG executable does not exist: $env:PKG_CONFIG"
            exit 1
          }
          & $env:PKG_CONFIG --version
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          & $env:PKG_CONFIG --libs --cflags dav1d
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
      - name: Verify bundled runtime DLL sources
        shell: pwsh
        run: |
          if (!(Test-Path third_party/dav1d/dav1d.dll)) {
            Write-Error "third_party/dav1d/dav1d.dll is missing"
            exit 1
          }
          $ffmpegBin = Join-Path $env:CBZ_VCPKG_ROOT "installed\x64-windows\bin"
          # avfilter remains a vcpkg/ff-sys link-time component, even though
          # the release package runtime allowlist excludes its DLL.
          $ffmpegLinkPrefixes = @("avcodec-", "avfilter-", "avformat-", "avutil-", "swresample-", "swscale-")
          $missingFfmpegDll = $ffmpegLinkPrefixes | Where-Object {
            -not (Get-ChildItem $ffmpegBin -Filter "$($_)*.dll" -File -ErrorAction SilentlyContinue)
          }
          $avcodecHeader = Join-Path $env:CBZ_VCPKG_ROOT "installed\x64-windows\include\libavcodec\avcodec.h"
          if (!(Test-Path $avcodecHeader) -or
              $missingFfmpegDll) {
            Write-Error "FFmpeg x64-windows development/runtime files are missing"
            exit 1
          }
          $ffmpegShare = Join-Path $env:CBZ_VCPKG_ROOT "installed\x64-windows\share\ffmpeg"
          if (!(Test-Path (Join-Path $ffmpegShare "copyright")) -or
              !(Test-Path (Join-Path $ffmpegShare "vcpkg.spdx.json"))) {
            Write-Error "FFmpeg/vcpkg license notices are missing"
            exit 1
          }
      - name: Package FFmpeg source bundle
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          & .\scripts\package_ffmpeg_source.ps1 `
            -Version "${{ github.ref_name }}" `
            -VcpkgRoot $env:CBZ_VCPKG_ROOT `
            -OutputDir "target/package" `
            -Triplet "x64-windows"
      - name: cargo build --release
        shell: pwsh
        run: |
          $start = Get-Date
          Write-Host "cargo build --release reached: start"
          cargo build --release
          Write-Host "cargo build --release reached: success"
          $elapsed = (Get-Date) - $start
          Write-Host ("cargo build elapsed seconds: {0:N2}" -f $elapsed.TotalSeconds)
      - name: Verify runtime DLLs prepared (release)
        shell: pwsh
        run: |
          $jpegRuntimeDlls = @(Get-ChildItem target/release -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^(turbojpeg|jpeg|libjpeg).*\.dll$' })
          if ($jpegRuntimeDlls.Count -gt 0) {
            Write-Error "TurboJPEG/libjpeg runtime DLLs were produced despite static linking: $($jpegRuntimeDlls.Name -join ', ')"
            exit 1
          }
          $dependents = @(dumpbin /dependents target/release/cbz-viewer.exe 2>&1)
          $jpegImports = @($dependents | Select-String -Pattern '(turbojpeg|libjpeg|jpeg)[^ ]*\.dll' -CaseSensitive:$false)
          if ($jpegImports.Count -gt 0) {
            Write-Error "The release executable imports a TurboJPEG/libjpeg DLL: $($jpegImports -join '; ')"
            exit 1
          }
          if (!(Test-Path target/release/dav1d.dll)) {
            Write-Error "target/release/dav1d.dll was not prepared by build.rs"
            exit 1
          }
          $allowedFfmpegRegex = '^(avcodec|avformat|avutil|swresample|swscale)-\d+\.dll$'
          $ffmpegDlls = @(Get-ChildItem target/release -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^(av|sw).+\.dll$' })
          $unexpectedFfmpegDlls = @($ffmpegDlls | Where-Object { $_.Name -notmatch $allowedFfmpegRegex })
          if ($unexpectedFfmpegDlls.Count -gt 0) {
            Write-Error "Unexpected FFmpeg runtime DLLs were prepared by build.rs: $($unexpectedFfmpegDlls.Name -join ', ')"
            exit 1
          }
          $missingFfmpegDll = @('avcodec', 'avformat', 'avutil', 'swresample', 'swscale') | Where-Object {
            @(Get-ChildItem target/release -Filter "$($_)-*.dll" -File -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match $allowedFfmpegRegex }).Count -ne 1
          }
          if ($missingFfmpegDll) {
            Write-Error "target/release FFmpeg runtime allowlist is incomplete or ambiguous: $($missingFfmpegDll -join ', ')"
            exit 1
          }
      - name: Resolve release package version
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version }}"
          if ("${{ github.event_name }}" -eq "push") {
            $version = "${{ github.ref_name }}"
          }
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = "dev"
          }

          $packageName = "cbz-tools-viewer-$version-windows-x64"
          Add-Content $env:GITHUB_ENV "CBZ_RELEASE_VERSION=$version"
          Add-Content $env:GITHUB_ENV "CBZ_RELEASE_PACKAGE=$packageName"

          Write-Host "CBZ_RELEASE_VERSION=$version"
          Write-Host "CBZ_RELEASE_PACKAGE=$packageName"
      - name: Package release zip
        shell: pwsh
        run: |
          $start = Get-Date
          Write-Host "package start"
          & .\scripts\package_windows_release.ps1 `
            -Version $env:CBZ_RELEASE_VERSION `
            -Workspace $env:GITHUB_WORKSPACE `
            -OutputDir "target/package"
          $elapsed = (Get-Date) - $start
          Write-Host "package end"
          Write-Host ("package elapsed seconds: {0:N2}" -f $elapsed.TotalSeconds)
      - name: Upload workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CBZ_RELEASE_PACKAGE }}
          retention-days: 7
          path: |
            target/package/${{ env.CBZ_RELEASE_PACKAGE }}.zip
            target/package/${{ env.CBZ_RELEASE_PACKAGE }}.zip.sha256
            target/package/ffmpeg-source-${{ env.CBZ_RELEASE_VERSION }}.zip
      - name: Upload release asset
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            target/package/${{ env.CBZ_RELEASE_PACKAGE }}.zip
            target/package/${{ env.CBZ_RELEASE_PACKAGE }}.zip.sha256
            target/package/ffmpeg-source-${{ github.ref_name }}.zip
